<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PAASWE AR Experience</title>


<!-- ================================================= -->
<!-- A-FRAME -->
<!-- ================================================= -->

<script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>


<!-- ================================================= -->
<!-- MINDAR -->
<!-- ================================================= -->

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

/* ================================================= */
/* BASIC */
/* ================================================= */

body {

    margin: 0;

    overflow: hidden;

    background: black;

    font-family: Arial, sans-serif;

    touch-action: none;

}


.example-container {

    width: 100%;

    height: 100%;

    position: absolute;

    overflow: hidden;

}


a-scene {

    touch-action: none;

}



/* ================================================= */
/* PROGRESS */
/* ================================================= */

#progress {

    position: fixed;

    top: 20px;

    right: 20px;

    z-index: 9999;

    color: white;

    background: rgba(0,0,0,0.75);

    padding: 10px 17px;

    border-radius: 25px;

    font-size: 20px;

    font-weight: bold;

    pointer-events: none;

}



/* ================================================= */
/* INSTRUCTION */
/* ================================================= */

#instruction {

    position: fixed;

    bottom: 25px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 9999;

    color: white;

    background: rgba(0,0,0,0.75);

    padding: 10px 18px;

    border-radius: 20px;

    font-size: 15px;

    text-align: center;

    pointer-events: none;

    display: none;

    white-space: nowrap;

}



/* ================================================= */
/* NEXT BUTTON */
/* ================================================= */

#nextButton {

    position: fixed;

    right: 25px;

    bottom: 25px;

    z-index: 9999;

    display: none;

    color: white;

    background: rgba(0,0,0,0.80);

    border: 2px solid white;

    padding: 12px 22px;

    border-radius: 25px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    user-select: none;

    -webkit-user-select: none;

    touch-action: manipulation;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;

}


#nextButton:active {

    transform: scale(0.95);

}



/* ================================================= */
/* FRAGMENT CLUE */
/* ================================================= */

#fragmentClue {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(72vw, 520px);
    max-height: 62vh;
    object-fit: contain;
    z-index: 9000;
    opacity: 0.45;
    display: none;
    pointer-events: none;
    border-radius: 8px;
}

#clueLabel {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9001;
    color: white;
    background: rgba(0,0,0,0.68);
    padding: 9px 16px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: bold;
    display: none;
    pointer-events: none;
    white-space: nowrap;
}

/* ================================================= */
/* FINAL SCREEN */
/* ================================================= */

#finalScreen {

    position: fixed;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    z-index: 10000;

    background: rgba(70,70,70,0.34);

    display: none;

    flex-direction: column;

    justify-content: flex-start;

    align-items: center;

    text-align: center;

    color: white;
    box-sizing: border-box;
    padding: 32px 20px 28px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;

    pointer-events: none;

}


#finalTitle {

    font-size: 34px;

    font-weight: 700;
    line-height: 1.15;

    margin: 0 0 14px 0;
    text-shadow: 0 2px 6px rgba(0,0,0,0.35);

}


#finalMural {

    width: auto;
    height: min(56vh, 540px);

    max-width: min(78vw, 540px);
    max-height: 56vh;

    object-fit: contain;

    display: block;
    box-shadow: 0 3px 18px rgba(0,0,0,0.18);

}


#finalMessage {

    margin-top: 14px;

    padding: 0 18px;
    width: min(900px, 92vw);

    max-width: 900px;

    font-size: 17px;

    line-height: 1.45;
    text-align: center;
    text-shadow: 0 2px 5px rgba(0,0,0,0.35);
    box-sizing: border-box;

}


/* FINAL SCREEN RESPONSIVE FIT */
@media (max-width: 700px) {
    #finalScreen {
        padding: 24px 14px 24px;
    }

    #finalTitle {
        font-size: 28px;
        margin-bottom: 10px;
    }

    #finalMural {
        height: min(54vh, 480px);
        max-width: 86vw;
    }

    #finalMessage {
        margin-top: 12px;
        padding: 0 8px;
        font-size: 15px;
        line-height: 1.4;
    }
}

</style>

</head>



<body>


<!-- ================================================= -->
<!-- PROGRESS -->
<!-- ================================================= -->

<div id="progress">

0/6

</div>



<!-- ================================================= -->
<!-- INSTRUCTION -->
<!-- ================================================= -->

<div id="instruction">

Scan a mural fragment to begin

</div>



<!-- ================================================= -->
<!-- FRAGMENT CLUE -->
<!-- ================================================= -->

<div id="clueLabel">
Find this mural fragment
</div>

<img id="fragmentClue" src="" alt="Mural fragment clue">


<!-- ================================================= -->
<!-- NEXT BUTTON -->
<!-- ================================================= -->

<div id="nextButton">

NEXT →

</div>



<!-- ================================================= -->
<!-- FINAL SCREEN -->
<!-- ================================================= -->

<div id="finalScreen">

    <div id="finalTitle">

        COMPLETE — 6/6

    </div>


    <img
        id="finalMural"
        src="./mural.final.png"
        alt="Final Mural">


    <div id="finalMessage">

        FINAL MURAL MESSAGE WILL GO HERE

    </div>

</div>



<!-- ================================================= -->
<!-- AR CONTAINER -->
<!-- ================================================= -->

<div class="example-container">


<a-scene

    id="scene"

    mindar-image="
        imageTargetSrc: ./targets.mind;
        maxTrack: 1;
    "

    embedded

    color-space="sRGB"

    renderer="
        colorManagement: true,
        physicallyCorrectLights
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false">


    <!-- ================================================= -->
    <!-- CAMERA -->
    <!-- ================================================= -->

    <a-camera

        id="camera"

        position="0 0 0"

        look-controls="enabled: false">

    </a-camera>



    <!-- ================================================= -->
    <!-- FRAGMENT 1 -->
    <!-- ================================================= -->

    <a-entity
        id="fragment1"
        mindar-image-target="targetIndex: 0">
    </a-entity>



    <!-- ================================================= -->
    <!-- FRAGMENT 2 -->
    <!-- ================================================= -->

    <a-entity
        id="fragment2"
        mindar-image-target="targetIndex: 1">
    </a-entity>



    <!-- ================================================= -->
    <!-- FRAGMENT 3 -->
    <!-- ================================================= -->

    <a-entity
        id="fragment3"
        mindar-image-target="targetIndex: 2">
    </a-entity>



    <!-- ================================================= -->
    <!-- FRAGMENT 4 -->
    <!-- ================================================= -->

    <a-entity
        id="fragment4"
        mindar-image-target="targetIndex: 3">
    </a-entity>



    <!-- ================================================= -->
    <!-- FRAGMENT 5 -->
    <!-- ================================================= -->

    <a-entity
        id="fragment5"
        mindar-image-target="targetIndex: 4">
    </a-entity>



    <!-- ================================================= -->
    <!-- FRAGMENT 6 -->
    <!-- ================================================= -->

    <a-entity
        id="fragment6"
        mindar-image-target="targetIndex: 5">
    </a-entity>


</a-scene>

</div>



<script>


/* ================================================= */
/* ELEMENTS */
/* ================================================= */

const scene =

    document.querySelector("#scene");


const camera =

    document.querySelector("#camera");


const progress =

    document.querySelector("#progress");


const instruction =

    document.querySelector("#instruction");


const fragmentClue =

    document.querySelector("#fragmentClue");


const clueLabel =

    document.querySelector("#clueLabel");


const nextButton =

    document.querySelector("#nextButton");


const finalScreen =

    document.querySelector("#finalScreen");


const finalMural =

    document.querySelector("#finalMural");


const finalMessage =

    document.querySelector("#finalMessage");



/* ================================================= */
/* SETTINGS */
/* ================================================= */

const TOTAL_FRAGMENTS = 6;

const WORKS_PER_FRAGMENT = 3;

/* ================================================= */
/* FRAGMENT DESCRIPTIONS */
/* ================================================= */

const fragmentDescriptions = [
    "Rooted in the industrial past, where personal dreams and initial ambitions begin.",
    "Stepping onto the path of action, where the fast-paced world brings the challenge of comparing yourself to others.",
    "Racing upwards through time, where pursuing perfection causes some to grow stronger and some to lose their inner selves.",
    "Pausing at the central clock is the main point where memories are recorded, and pulling back to our original goals.",
    "Facing the modern world and rethinking what success means; keep chasing an impossible ideal of perfection, or choose to be at peace with yourself.",
    "Floating upward into self-acceptance, realizing you are already good enough just as you are."
];

/* ================================================= */
/* MURAL FRAGMENT CLUE IMAGES */
/* ================================================= */

const fragmentClueImages = [
    ["./mural.fragment.1.png", "./mural.fragment1.png"],
    ["./mural.fragment.2.png", "./mural.fragment2.png"],
    ["./mural.fragment.3.png", "./mural.fragment3.png"],
    ["./mural.fragment.4.png", "./mural.fragment4.png"],
    ["./mural.fragment.5.png", "./mural.fragment5.png"],
    ["./mural.fragment.6.png", "./mural.fragment6.png"]
];

let clueFallbackIndex = 0;

/* ================================================= */
/* FRAGMENT CLUE FUNCTIONS */
/* ================================================= */

function showFragmentClue(index) {
    if (index < 0 || index >= TOTAL_FRAGMENTS) {
        hideFragmentClue();
        return;
    }

    const sources = fragmentClueImages[index];
    clueFallbackIndex = 0;

    fragmentClue.onload = function() {
        fragmentClue.style.display = "block";
        clueLabel.innerText = "Find mural fragment " + (index + 1);
        clueLabel.style.display = "block";
    };

    fragmentClue.onerror = function() {
        if (clueFallbackIndex < sources.length - 1) {
            clueFallbackIndex++;
            fragmentClue.src = sources[clueFallbackIndex];
        } else {
            console.warn("⚠️ CLUE IMAGE NOT FOUND — FRAGMENT " + (index + 1));
            fragmentClue.style.display = "none";
            clueLabel.innerText = "Find mural fragment " + (index + 1);
            clueLabel.style.display = "block";
        }
    };

    fragmentClue.src = sources[0];
}

function hideFragmentClue() {
    fragmentClue.style.display = "none";
    clueLabel.style.display = "none";
}

function isExpectedFragment(fragment) {
    return fragment && fragment.index === completedFragments;
}




/* ================================================= */
/* FRAGMENTS */
/* ================================================= */

const fragments = [];


for (

    let i = 1;

    i <= TOTAL_FRAGMENTS;

    i++

) {

    fragments.push({

        target:

            document.querySelector(
                "#fragment" + i
            ),

        index:

            i - 1,

        hotspots: [],

        works: [],

        caption: null,

        completedWorks: 0,

        found: false

    });

}



/* ================================================= */
/* GLOBAL STATE */
/* ================================================= */


/*
    Current active fragment.
*/

let activeFragment = null;


/*
    Current Student Work.

    VERY IMPORTANT:

    Only ONE Student Work can
    exist as active at a time.
*/

let activeWork = null;


/*
    Current work index.
*/

let activeWorkIndex = -1;


/*
    Rotation.
*/

let isDragging = false;


/*
    Pointer position.
*/

let previousX = 0;

let previousY = 0;


/*
    Movement distance.
*/

let movedDistance = 0;


/*
    Total completed fragments.
*/

let completedFragments = 0;



/* ================================================= */
/* CREATE FRAGMENT CAPTION */
/* ================================================= */

function createFragmentCaption(fragment) {

    const caption = document.createElement("a-entity");

    caption.id =
        "fragment" + (fragment.index + 1) + "-caption";

    /* Caption stays attached to the target and sits below it. */
    caption.setAttribute("position", "0 -0.62 0.14");
    caption.setAttribute("visible", "false");

    const panel = document.createElement("a-plane");
    panel.setAttribute("position", "0 0 -0.01");
    panel.setAttribute("width", "1.55");
    panel.setAttribute("height", "0.22");
    panel.setAttribute(
        "material",
        "color: #000000; opacity: 0.68; transparent: true; side: double;"
    );
    caption.appendChild(panel);

    const text = document.createElement("a-text");
    text.setAttribute("value", fragmentDescriptions[fragment.index]);
    text.setAttribute("align", "center");
    text.setAttribute("anchor", "center");
    text.setAttribute("baseline", "center");
    text.setAttribute("width", "1.45");
    text.setAttribute("color", "#FFFFFF");
    text.setAttribute("wrap-count", "48");
    text.setAttribute("side", "double");
    caption.appendChild(text);

    fragment.target.appendChild(caption);
    fragment.caption = caption;

    return caption;
}

/* ================================================= */
/* SHOW / HIDE FRAGMENT CAPTION */
/* ================================================= */

function showFragmentCaption(fragment) {
    if (fragment.caption) {
        fragment.caption.setAttribute("visible", "true");
    }
}

function hideFragmentCaption(fragment) {
    if (fragment.caption) {
        fragment.caption.setAttribute("visible", "false");
    }
}


/* ================================================= */
/* CREATE STUDENT WORK */
/* ================================================= */

function createStudentWork(

    fragment,

    workIndex

) {

    const work =

        document.createElement(
            "a-entity"
        );


    work.id =

        "fragment" +

        (fragment.index + 1) +

        "-work" +

        (workIndex + 1);


    work.setAttribute(

        "position",

        "0 0 0.35"

    );


    work.setAttribute(

        "visible",

        "false"

    );


    /* ================================================= */
    /* REAL GLB TEST — STUDENT WORK 1 ONLY */
    /* ================================================= */
    /*
        Only Fragment 1 / Student Work 1 uses
        the real GLB.

        Every other Student Work keeps the
        existing test geometry so the rest of
        the AR system remains unchanged.
    */

    if (
        fragment.index === 0 &&
        workIndex === 0
    ) {

        const model =
            document.createElement(
                "a-entity"
            );


        /*
            =================================================
            REAL GLB — STUDENT WORK 1 ONLY
            =================================================

            The GLB must be in the same folder as index.html.

            IMPORTANT FIX:
            Do NOT use a hard-coded position such as
            -1.074 -8.34 2.646.

            That position can place the model far outside
            the camera view. Instead, the model is loaded at
            the Student Work origin and automatically centred
            from its real bounding box.
        */

        model.setAttribute(
            "gltf-model",
            "./student-work-01.glb"
        );


        /*
            Start at the Student Work origin.
            The final scale is applied after the GLB loads.
        */

        model.setAttribute(
            "position",
            "0 0 0"
        );

        model.setAttribute(
            "scale",
            "1 1 1"
        );


        model.addEventListener(
            "model-loaded",
            function() {

                const mesh =
                    model.getObject3D("mesh");

                if (!mesh) {

                    console.error(
                        "❌ GLB loaded but mesh was not found"
                    );

                    return;

                }


                /*
                    Force the GLB transforms to update before
                    calculating its actual bounds.
                */

                mesh.updateMatrixWorld(true);


                /*
                    Calculate the real bounding box of the GLB.
                    This works even if the model dimensions or
                    origin are different from the previous test.
                */

                const box =
                    new THREE.Box3().setFromObject(mesh);

                const center =
                    box.getCenter(
                        new THREE.Vector3()
                    );

                const size =
                    box.getSize(
                        new THREE.Vector3()
                    );


                /*
                    Move the actual mesh so its centre sits at
                    the Student Work pivot.
                */

                mesh.position.x -= center.x;
                mesh.position.y -= center.y;
                mesh.position.z -= center.z;


                /*
                    Automatically fit the model to the AR space.
                    The largest dimension becomes approximately
                    1.0 AR unit.

                    This avoids relying on the old hard-coded
                    0.025 scale.
                */

                const maxDimension =
                    Math.max(
                        size.x,
                        size.y,
                        size.z
                    );

                const fitScale =
                    maxDimension > 0
                        ? 1.0 / maxDimension
                        : 0.025;

                model.object3D.scale.set(
                    fitScale,
                    fitScale,
                    fitScale
                );


                /*
                    Keep the model slightly in front of the
                    mural surface, matching the original work
                    entity position.
                */

                model.object3D.position.z = 0;


                console.log(
                    "✅ GLB LOADED — STUDENT WORK 1"
                );

                console.log(
                    "📦 GLB SIZE:",
                    size.x,
                    size.y,
                    size.z
                );

                console.log(
                    "📐 GLB FIT SCALE:",
                    fitScale
                );

            }
        );


        model.addEventListener(
            "model-error",
            function(event) {

                console.error(
                    "❌ GLB FAILED TO LOAD — CHECK FILE NAME/PATH:",
                    "./student-work-01.glb",
                    event
                );

            }
        );


        work.appendChild(model);

    }

    else {

        /* ================================================= */
        /* ORIGINAL TEST STUDENT WORK */
        /* ================================================= */

        const box1 =

            document.createElement(
                "a-box"
            );


        box1.setAttribute(

            "position",

            "0 0 0"

        );


        box1.setAttribute(

            "scale",

            "0.6 0.15 0.15"

        );


        box1.setAttribute(

            "color",

            "#333333"

        );


        work.appendChild(box1);



        const box2 =

            document.createElement(
                "a-box"
            );


        box2.setAttribute(

            "position",

            "0 0.3 0"

        );


        box2.setAttribute(

            "scale",

            "0.15 0.6 0.15"

        );


        box2.setAttribute(

            "color",

            "#555555"

        );


        work.appendChild(box2);



        const sphere =

            document.createElement(
                "a-sphere"
            );


        sphere.setAttribute(

            "position",

            "0 0.65 0"

        );


        sphere.setAttribute(

            "radius",

            "0.15"

        );


        sphere.setAttribute(

            "color",

            "#FFD400"

        );


        work.appendChild(sphere);

    }



    fragment.target.appendChild(work);


    fragment.works.push(work);


    return work;

}



/* ================================================= */
/* CREATE HOTSPOT */
/* ================================================= */

function createHotspot(

    fragment,

    workIndex

) {

    const hotspot =

        document.createElement(
            "a-entity"
        );


    hotspot.id =

        "fragment" +

        (fragment.index + 1) +

        "-hotspot" +

        (workIndex + 1);


    hotspot.classList.add(
        "hotspot"
    );


    /*
        TEST POSITIONS
    */

    const positions = [

        "-0.45 0.15 0.12",

        "0.00 0.05 0.12",

        "0.42 0.20 0.12"

    ];


    hotspot.setAttribute(

        "position",

        positions[workIndex]

    );


    hotspot.setAttribute(

        "visible",

        "false"

    );



    /* ================================================= */
    /* OUTER GLOW */
    /* ================================================= */

    const glow =

        document.createElement(
            "a-sphere"
        );


    glow.setAttribute(

        "radius",

        "0.11"

    );


    glow.setAttribute(

        "material",

        "color: #FFD400; opacity: 0.25; transparent: true; shader: standard; emissive: #FFD400; emissiveIntensity: 2;"

    );


    hotspot.appendChild(glow);



    /* ================================================= */
    /* INNER LIGHT */
    /* ================================================= */

    const inner =

        document.createElement(
            "a-sphere"
        );


    inner.setAttribute(

        "radius",

        "0.055"

    );


    inner.setAttribute(

        "material",

        "color: #FFFFFF; emissive: #FFFFFF; emissiveIntensity: 3;"

    );


    hotspot.appendChild(inner);



    /* ================================================= */
    /* PULSE */
    /* ================================================= */

    const animation =

        document.createElement(
            "a-animation"
        );


    animation.setAttribute(

        "attribute",

        "scale"

    );


    animation.setAttribute(

        "from",

        "1 1 1"

    );


    animation.setAttribute(

        "to",

        "1.45 1.45 1.45"

    );


    animation.setAttribute(

        "dur",

        "900"

    );


    animation.setAttribute(

        "direction",

        "alternate"

    );


    animation.setAttribute(

        "repeat",

        "indefinite"

    );


    animation.setAttribute(

        "easing",

        "ease-in-out"

    );


    hotspot.appendChild(animation);



    /* ================================================= */
    /* RING */
/* ================================================= */

    const ring =

        document.createElement(
            "a-ring"
        );


    ring.setAttribute(

        "radius-inner",

        "0.12"

    );


    ring.setAttribute(

        "radius-outer",

        "0.16"

    );


    ring.setAttribute(

        "rotation",

        "-90 0 0"

    );


    ring.setAttribute(

        "material",

        "color: #FFD400; emissive: #FFD400; emissiveIntensity: 2; side: double;"

    );


    hotspot.appendChild(ring);



    fragment.target.appendChild(hotspot);


    fragment.hotspots.push(hotspot);


    return hotspot;

}



/* ================================================= */
/* BUILD ALL */
/* ================================================= */

fragments.forEach(

    function(fragment) {

        createFragmentCaption(fragment);


        for (

            let i = 0;

            i < WORKS_PER_FRAGMENT;

            i++

        ) {

            createHotspot(

                fragment,

                i

            );


            createStudentWork(

                fragment,

                i

            );

        }

    }

);



/* ================================================= */
/* SHOW HOTSPOTS */
/* ================================================= */

function showFragmentHotspots(

    fragment

) {


    /*
        VERY IMPORTANT:

        If there is currently a Student Work
        being viewed, DO NOT show hotspots.

        This prevents accidental second
        Student Work opening.
    */

    if (activeWork) {

        return;

    }


    fragment.hotspots.forEach(

        function(

            hotspot,

            index

        ) {


            const work =

                fragment.works[index];


            if (

                work.dataset.completed !== "true"

            ) {

                hotspot.setAttribute(

                    "visible",

                    "true"

                );

            }

        }

    );


    showFragmentCaption(fragment);

    instruction.innerText =

        "Tap a glowing shape to explore the student work";


    instruction.style.display =

        "block";

}



/* ================================================= */
/* HIDE HOTSPOTS */
/* ================================================= */

function hideFragmentHotspots(

    fragment

) {

    fragment.hotspots.forEach(

        function(hotspot) {

            hotspot.setAttribute(

                "visible",

                "false"

            );

        }

    );

}



/* ================================================= */
/* TARGET FOUND */
/* ================================================= */

fragments.forEach(

    function(fragment) {


        fragment.target.addEventListener(

            "targetFound",

            function() {

                fragment.found = true;

                console.log(
                    "🎯 TARGET FOUND — FRAGMENT " +
                    (fragment.index + 1)
                );

                /* Only the fragment shown by the faded clue is accepted. */
                if (!isExpectedFragment(fragment)) {
                    console.log(
                        "🚫 WRONG FRAGMENT — EXPECTED FRAGMENT " +
                        (completedFragments + 1)
                    );

                    instruction.innerText =
                        "Not this fragment — find Fragment " +
                        (completedFragments + 1);

                    instruction.style.display = "block";
                    return;
                }

                activeFragment = fragment;

                /* Correct fragment found — remove the faded clue. */
                hideFragmentClue();

                if (activeWork) {
                    return;
                }

                if (
                    fragment.completedWorks >=
                    WORKS_PER_FRAGMENT
                ) {
                    return;
                }

                showFragmentHotspots(fragment);


            }

        );



        /* ================================================= */
        /* TARGET LOST */
        /* ================================================= */

        fragment.target.addEventListener(

            "targetLost",

            function() {


                fragment.found = false;

                hideFragmentCaption(fragment);


                console.log(

                    "❌ TARGET LOST — FRAGMENT " +

                    (fragment.index + 1)

                );


                /*
                    If this is the expected fragment, bring the faded clue back.
                */
                if (
                    !activeWork &&
                    fragment.index === completedFragments
                ) {
                    showFragmentClue(completedFragments);
                }

                /*
                    Stop rotation if target disappears.
                */

                isDragging = false;

            }

        );

    }

);



/* ================================================= */
/* THREE RAYCASTER */
/* ================================================= */

const raycaster =

    new THREE.Raycaster();


const mouse =

    new THREE.Vector2();



/* ================================================= */
/* GET REAL THREE CAMERA */
/* ================================================= */

function getThreeCamera() {


    if (

        scene.camera &&

        scene.camera.isCamera

    ) {

        return scene.camera;

    }


    if (

        camera.components &&

        camera.components.camera &&

        camera.components.camera.camera

    ) {

        return camera.components.camera.camera;

    }


    return null;

}



/* ================================================= */
/* CHECK HOTSPOT */
/* ================================================= */

function checkHotspotClick(

    clientX,

    clientY

) {


    /*
        =================================================
        IMPORTANT LOCK
        =================================================

        If a Student Work is already open,
        absolutely NO hotspot can be clicked.
    */

    if (activeWork) {

        console.log(

            "🔒 HOTSPOTS LOCKED — STUDENT WORK OPEN"

        );

        return false;

    }


    if (!activeFragment) {

        return false;

    }


    if (!activeFragment.found) {

        return false;

    }


    const canvas =

        scene.canvas;


    if (!canvas) {

        return false;

    }


    const rect =

        canvas.getBoundingClientRect();


    mouse.x =

        (

            (clientX - rect.left)

            /

            rect.width

        ) * 2 - 1;


    mouse.y =

        - (

            (clientY - rect.top)

            /

            rect.height

        ) * 2 + 1;


    const threeCamera =

        getThreeCamera();


    if (!threeCamera) {

        console.log(

            "❌ THREE CAMERA NOT READY"

        );

        return false;

    }


    raycaster.setFromCamera(

        mouse,

        threeCamera

    );



    /*
        ONLY check current fragment.
    */

    for (

        let i = 0;

        i < activeFragment.hotspots.length;

        i++

    ) {


        const hotspot =

            activeFragment.hotspots[i];


        if (

            !hotspot.object3D.visible

        ) {

            continue;

        }


        const intersections =

            raycaster.intersectObject(

                hotspot.object3D,

                true

            );


        if (

            intersections.length > 0

        ) {


            console.log(

                "✨ HOTSPOT CLICKED — FRAGMENT " +

                (activeFragment.index + 1) +

                " — WORK " +

                (i + 1)

            );


            openStudentWork(

                activeFragment.index,

                i

            );


            return true;

        }

    }


    return false;

}



/* ================================================= */
/* OPEN STUDENT WORK */
/* ================================================= */

function openStudentWork(

    fragmentIndex,

    workIndex

) {


    /*
        =================================================
        HARD LOCK

        Prevent opening another work while
        one is already active.
        =================================================
    */

    if (activeWork) {

        console.log(

            "🔒 ANOTHER STUDENT WORK IS ALREADY OPEN"

        );

        return;

    }


    const fragment =

        fragments[fragmentIndex];


    const work =

        fragment.works[workIndex];


    const hotspot =

        fragment.hotspots[workIndex];


    /*
        Don't open completed work.
    */

    if (

        work.dataset.completed === "true"

    ) {

        return;

    }


    /*
        Set active states.
    */

    activeFragment =

        fragment;


    activeWork =

        work;


    activeWorkIndex =

        workIndex;



    /*
        =================================================
        HIDE ALL HOTSPOTS
        =================================================

        This is the important part.

        When Student Work appears,
        ALL other glowing shapes disappear.

        Therefore visitor cannot accidentally
        click another hotspot.
    */

    hideFragmentHotspots(

        fragment

    );

    hideFragmentCaption(fragment);



    /*
        Show Student Work.
    */

    work.setAttribute(

        "visible",

        "true"

    );


    /*
        Reset rotation.
    */

    work.object3D.rotation.set(

        0,

        0,

        0

    );


    /*
        Hide instruction.
    */

    instruction.style.display =

        "none";


    /*
        =================================================
        SHOW NEXT BUTTON
        =================================================
    */

    nextButton.style.display =

        "block";


    console.log(

        "🧱 STUDENT WORK " +

        (workIndex + 1) +

        " SHOWN — FRAGMENT " +

        (fragmentIndex + 1)

    );


    console.log(

        "🔒 OTHER HOTSPOTS LOCKED"

    );

}



/* ================================================= */
/* NEXT BUTTON */
/* ================================================= */

nextButton.addEventListener(

    "click",

    function(event) {


        /*
            Prevent this click from
            affecting AR rotation.
        */

        event.stopPropagation();


        /*
            Nothing active.
        */

        if (!activeWork) {

            return;

        }


        console.log(

            "➡️ NEXT BUTTON CLICKED"

        );


        finishCurrentStudentWork();

    }

);



/* ================================================= */
/* FINISH CURRENT STUDENT WORK */
/* ================================================= */

function finishCurrentStudentWork() {


    if (!activeWork) {

        return;

    }


    if (!activeFragment) {

        return;

    }


    /*
        Save references before clearing.
    */

    const work =

        activeWork;


    const fragment =

        activeFragment;



    /*
        =================================================
        MARK WORK COMPLETE
        =================================================
    */

    if (

        work.dataset.completed === "true"

    ) {

        return;

    }


    work.dataset.completed =

        "true";


    fragment.completedWorks++;


    console.log(

        "✅ STUDENT WORK COMPLETED — FRAGMENT " +

        (fragment.index + 1) +

        " — " +

        fragment.completedWorks +

        "/" +

        WORKS_PER_FRAGMENT

    );



    /*
        =================================================
        HIDE STUDENT WORK
        =================================================
    */

    work.setAttribute(

        "visible",

        "false"

    );



    /*
        =================================================
        CLEAR ACTIVE WORK
        =================================================
    */

    activeWork =

        null;


    activeWorkIndex =

        -1;



    /*
        =================================================
        HIDE NEXT BUTTON
        =================================================
    */

    nextButton.style.display =

        "none";



    /*
        =================================================
        CHECK FRAGMENT
        =================================================
    */

    if (

        fragment.completedWorks >=

        WORKS_PER_FRAGMENT

    ) {


        completeFragment(

            fragment

        );

    }

    else {


        /*
            More Student Works remain.

            Now the hotspots are unlocked again.
        */

        showFragmentHotspots(

            fragment

        );


        console.log(

            "🔓 NEXT HOTSPOT UNLOCKED"

        );

    }

}



/* ================================================= */
/* MOUSE DOWN */
/* ================================================= */

window.addEventListener(

    "mousedown",

    function(event) {


        console.log(

            "🖱️ MOUSE DOWN"

        );


        /*
            First check hotspot.

            If hotspot is clicked,
            open Student Work.

            Do NOT start rotation.
        */

        const hotspotClicked =

            checkHotspotClick(

                event.clientX,

                event.clientY

            );


        if (hotspotClicked) {

            return;

        }


        /*
            No Student Work.
        */

        if (!activeWork) {

            return;

        }


        /*
            Student Work must be visible.
        */

        if (

            !activeWork.object3D.visible

        ) {

            return;

        }


        /*
            Start rotation.
        */

        isDragging =

            true;


        movedDistance =

            0;


        previousX =

            event.clientX;


        previousY =

            event.clientY;


        console.log(

            "✋ ROTATION START — FRAGMENT " +

            (activeFragment.index + 1) +

            " — WORK " +

            (activeWorkIndex + 1)

        );

    }

);



/* ================================================= */
/* MOUSE MOVE */
/* ================================================= */

window.addEventListener(

    "mousemove",

    function(event) {


        if (!isDragging) {

            return;

        }


        if (!activeWork) {

            return;

        }


        const deltaX =

            event.clientX -

            previousX;


        const deltaY =

            event.clientY -

            previousY;


        movedDistance +=

            Math.abs(deltaX) +

            Math.abs(deltaY);


        /*
            Horizontal.
        */

        activeWork.object3D.rotation.y +=

            deltaX * 0.01;


        /*
            Vertical.
        */

        activeWork.object3D.rotation.x +=

            deltaY * 0.01;


        previousX =

            event.clientX;


        previousY =

            event.clientY;

    }

);



/* ================================================= */
/* MOUSE UP */
/* ================================================= */

window.addEventListener(

    "mouseup",

    function() {


        if (!isDragging) {

            return;

        }


        isDragging =

            false;


        /*
            IMPORTANT:

            Do NOT complete Student Work here.

            Visitor must press NEXT.
        */

        console.log(

            "✋ ROTATION END — PRESS NEXT WHEN READY"

        );


        movedDistance =

            0;

    }

);



/* ================================================= */
/* TOUCH START */
/* ================================================= */

window.addEventListener(

    "touchstart",

    function(event) {

        /*
            IMPORTANT — MOBILE BUTTON FIX

            If the visitor touches NEXT, do NOT let the
            global AR touch handler capture the gesture.
            Otherwise preventDefault() can stop the browser
            from generating the mobile click event.
        */
        if (
            event.target === nextButton ||
            nextButton.contains(event.target)
        ) {
            return;
        }


        if (

            event.touches.length === 0

        ) {

            return;

        }


        const touch =

            event.touches[0];


        /*
            Check hotspot FIRST.
        */

        const hotspotClicked =

            checkHotspotClick(

                touch.clientX,

                touch.clientY

            );


        if (hotspotClicked) {

            event.preventDefault();

            return;

        }


        /*
            No active work.
        */

        if (!activeWork) {

            return;

        }


        if (

            !activeWork.object3D.visible

        ) {

            return;

        }


        /*
            Start rotation.
        */

        isDragging =

            true;


        movedDistance =

            0;


        previousX =

            touch.clientX;


        previousY =

            touch.clientY;


        console.log(

            "✋ TOUCH ROTATION START — FRAGMENT " +

            (activeFragment.index + 1) +

            " — WORK " +

            (activeWorkIndex + 1)

        );


        event.preventDefault();

    },

    {

        passive: false

    }

);



/* ================================================= */
/* TOUCH MOVE */
/* ================================================= */

window.addEventListener(

    "touchmove",

    function(event) {


        if (!isDragging) {

            return;

        }


        if (!activeWork) {

            return;

        }


        if (

            event.touches.length === 0

        ) {

            return;

        }


        const touch =

            event.touches[0];


        const deltaX =

            touch.clientX -

            previousX;


        const deltaY =

            touch.clientY -

            previousY;


        movedDistance +=

            Math.abs(deltaX) +

            Math.abs(deltaY);


        /*
            Horizontal rotation.
        */

        activeWork.object3D.rotation.y +=

            deltaX * 0.01;


        /*
            Vertical rotation.
        */

        activeWork.object3D.rotation.x +=

            deltaY * 0.01;


        previousX =

            touch.clientX;


        previousY =

            touch.clientY;


        event.preventDefault();

    },

    {

        passive: false

    }

);



/* ================================================= */
/* TOUCH END */
/* ================================================= */

window.addEventListener(

    "touchend",

    function() {


        if (!isDragging) {

            return;

        }


        isDragging =

            false;


        /*
            IMPORTANT:

            Do NOT complete here.

            Visitor controls NEXT.
        */

        console.log(

            "✋ TOUCH ROTATION END — PRESS NEXT WHEN READY"

        );


        movedDistance =

            0;

    }

);



/* ================================================= */
/* COMPLETE FRAGMENT */
/* ================================================= */

function completeFragment(

    fragment

) {


    console.log(

        "🎉 FRAGMENT " +

        (fragment.index + 1) +

        " COMPLETED!"

    );


    /*
        Hide remaining hotspots.
    */

    hideFragmentHotspots(

        fragment

    );

    hideFragmentCaption(fragment);


    /*
        Increase fragment count.
    */

    completedFragments++;


    /*
        Update progress.
    */

    progress.innerText =

        completedFragments +

        "/" +

        TOTAL_FRAGMENTS;



    /*
        =================================================
        ALL 6 COMPLETE?
        =================================================
    */

    if (

        completedFragments >=

        TOTAL_FRAGMENTS

    ) {


        showFinalMural();

    }

    else {


        instruction.innerText =

            "Fragment " +

            (fragment.index + 1) +

            " complete — find the next mural fragment";


        instruction.style.display =

            "block";

        /* Show the faded clue for the next fragment. */
        showFragmentClue(completedFragments);

    }

}



/* ================================================= */
/* FINAL MURAL */
/* ================================================= */

function showFinalMural() {

    hideFragmentClue();


    console.log(

        "🎉 ALL 6 FRAGMENTS COMPLETED!"

    );


    progress.innerText =

        "6/6";


    instruction.style.display =

        "none";


    /*
        Hide AR.
    */

    /*
         IMPORTANT:
         Keep the live AR camera visible.
         The final mural is shown as an overlay.
    */

    document.querySelector(
        ".example-container"
    ).style.display = "block";


    /*
        Show final screen.
    */

    finalScreen.style.display = "flex";


    /*
        Show mural.
    */

    finalMural.style.display =

        "block";


    /*
        Final message.

        Change later.
    */

    finalMessage.innerText =
        "Dreams are intangible, they cannot be seen or touched. Technology, a creation of humans has becomes an extensions of our senses, it captures memories, emotions, and moments of everyday that we often overlook. The times, each era remind us to pause, reflects and continue chasing our dreams without losing ourself.";

}



/* ================================================= */
/* INITIAL */
/* ================================================= */

instruction.innerText =

    "Scan a mural fragment to begin";


showFragmentClue(0);



/* ================================================= */
/* DEBUG */
/* ================================================= */

console.log(

    "🚀 PAASWE AR SYSTEM READY"

);


console.log(

    "📦 6 FRAGMENTS"

);


console.log(

    "✨ " +

    WORKS_PER_FRAGMENT +

    " HOTSPOTS PER FRAGMENT"

);


console.log(

    "🧱 " +

    WORKS_PER_FRAGMENT +

    " STUDENT WORKS PER FRAGMENT"

);


console.log(

    "🔒 ONE STUDENT WORK AT A TIME"

);


console.log(

    "➡️ NEXT BUTTON CONTROLS COMPLETION"

);


</script>
